name: Deploy to Production

on:
  push:
    branches: [prod-branch]
  workflow_dispatch:

jobs:
  check-commit:
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.match }}
    steps:
      - name: Check commit message format
        id: check
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if echo "$MSG" | grep -qE "^(feat|fix|chore|docs|style|refactor|perf|test|build|ci)(\(.+\))?: .+"; then
            echo "match=true" >> $GITHUB_OUTPUT
          else
            echo "match=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: check-commit
    if: needs.check-commit.outputs.should-deploy == 'true' || contains(github.event.head_commit.message, 'Merge')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/vedashi-prod
            ./deploy.sh
